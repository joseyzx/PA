<script>
    var np = parseInt(prompt("Entre com o último número da placa"));
    switch(np){
        case 1:
        case 2:
            alert("Não rodará na segunda-feira");
            break;
        case 3:
        case 4:
            alert("Não rodará na terça-feira");
            break;
        case 5:
        case 6:
            alert("Não rodará na quarta-feira");
            break;
        case 7:
        case 8:
            alert("Não rodará na quinta-feira");
            break;
        case 9:
        case 0:
            alert("Não rodará na sexta-feira");
            break;
        default;
            alert("Número Inválido");
    }
</script>
