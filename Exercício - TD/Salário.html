<script>
    var salario=parseFloat (prompt ("Entre com o Salario da Pessoa"));
    var salarioMin=parseFloat (prompt ("Entre com o valor do Salario Minimo"));
    document.write ("Salario =" +salario + "<br>");
    if (salario<salarioMin) { 
        document.write ("Salario abaixo do Minimo");
    }else{
        document.write ("Salario dentro da Lei");
    }
</script>
