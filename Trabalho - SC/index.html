<script>
    var li = parseInt(prompt("Leia a Idade do Aluno"));
    switch (li){
        case 6:
            alert("Dente de leite");
            break;
        case 7:
            alert("Júnior");
            break;
        case 8:
            alert("Júnior max");
            break;
        case 9:
            alert("Júnior master");
            break;
        case 10:
            alert("Master");
            break;
        default:
            alert("Idade não Permitida");
    }
</script>
