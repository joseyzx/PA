<script>
var vetor = [];
var i;
var pares = 0;
var impares = 0;

for (i = 0; i < 10; i++) {
    vetor[i] = Number(prompt("Digite um número inteiro:"));

    if (vetor[i] % 2 == 0) {
        pares++;
    } else {
        impares++;
    }
}

document.write("Vetor: " + vetor + "<br>");
document.write("Quantidade de pares: " + pares + "<br>");
document.write("Quantidade de ímpares: " + impares);
</script>
