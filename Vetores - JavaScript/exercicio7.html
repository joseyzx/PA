<script>
var vetor = [];
var inverso = [];
var i;

for (i = 0; i < 10; i++) {
    vetor[i] = Number(prompt("Digite um número inteiro:"));
}

for (i = 0; i < 10; i++) {
    inverso[i] = vetor[9 - i];
}

document.write("Vetor original: " + vetor + "<br>");
document.write("Vetor na ordem inversa: " + inverso);
</script>
