<script>
var vetor = [];
var i;
var positivos = 0;
var negativos = 0;
var zeros = 0;

for (i = 0; i < 10; i++) {
    vetor[i] = Number(prompt("Digite um número inteiro:"));

    if (vetor[i] > 0) {
        positivos++;
    } else if (vetor[i] < 0) {
        negativos++;
    } else {
        zeros++;
    }
}

document.write("Vetor: " + vetor + "<br>");
document.write("Quantidade de positivos: " + positivos + "<br>");
document.write("Quantidade de negativos: " + negativos + "<br>");
document.write("Quantidade de zeros: " + zeros);
</script>
